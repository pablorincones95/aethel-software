name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # 1. Type check + Lint
  # ─────────────────────────────────────────
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Stylelint (SCSS)
        run: pnpm lint:css

  # ─────────────────────────────────────────
  # 2. Build check
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Supabase vars — use dummy values for build check
      # Real values are set in Vercel/deployment environment
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────
  # 3. Security scan — detect obfuscated code
  # ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for obfuscated/malicious patterns
        run: |
          echo "Scanning for suspicious patterns..."
          # Detect hex-array obfuscation (supply-chain attack pattern)
          if grep -rn "_0x[0-9a-f]\{4,\}" . \
            --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next; then
            echo "::error::Obfuscated hex-array pattern detected! Possible malware."
            exit 1
          fi
          # Detect eval-based code execution
          if grep -rn "v8\s*(['\"]" . \
            --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next; then
            echo "::error::Suspicious v8() call detected!"
            exit 1
          fi
          echo "✅ No suspicious patterns found."

      - name: Check for committed secrets
        run: |
          echo "Checking for accidentally committed secrets..."
          if grep -rn "supabase\.co" . \
            --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next \
            | grep -v "process\.env\|your-project" ; then
            echo "::warning::Possible hardcoded Supabase URL found. Verify it's not a real credential."
          fi
          echo "✅ Secret scan complete."
